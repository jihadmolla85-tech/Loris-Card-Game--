<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Play LORIS, the team-based trick-taking card game, offline against AI.">
  <meta name="theme-color" content="#3D0D1B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LORIS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/loris-logo.svg">
  <title>LORIS – The Ultimate Card Game</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; min-height: 100%; background: #3D0D1B; }
    #loris-loading {
      position: fixed; inset: 0; z-index: 9999; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; background: radial-gradient(ellipse at center, #65182a 0%, #3D0D1B 72%);
      transition: opacity 260ms ease;
    }
    #loris-loading img { width: min(66vw, 280px); height: auto; filter: drop-shadow(0 12px 28px #16071199); }
    #loris-loading span { color: #F5D88E; font: 700 11px/1.4 Arial, sans-serif; letter-spacing: .32em; }
    #loris-loading::after {
      content: ""; width: 34px; height: 3px; border-radius: 4px;
      background: linear-gradient(90deg, #9C6427, #FFF0AD, #9C6427);
      animation: loris-pulse 1.1s ease-in-out infinite;
    }
    @keyframes loris-pulse { 0%, 100% { opacity: .35; transform: scaleX(.55); } 50% { opacity: 1; transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { #loris-loading::after { animation: none; } }
  </style>
</head>
<body>
  <div id="loris-loading" role="status" aria-label="Loading LORIS">
    <img src="icons/loris-logo.svg" alt="LORIS">
    <span>PREPARING YOUR TABLE</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loris-loading');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 280);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
