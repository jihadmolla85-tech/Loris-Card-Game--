
name: Build LORIS Match Score System

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Match Score Files
        run: |
          dart analyze \
            lib/game/engine/match_score_engine.dart \
            test/game/match_score_engine_test.dart

      - name: Run Match Score Tests
        run: flutter test test/game/match_score_engine_test.dart
