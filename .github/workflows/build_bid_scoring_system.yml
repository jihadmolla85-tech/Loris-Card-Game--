
name: Build LORIS Bid Scoring System

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Bid Scoring Engine
        run: |
          mkdir -p lib/game/engine
          cat > lib/game/engine/bid_scoring_engine.dart <<'EOF'
          class BidScoreResult {
            final bool success;
            final int biddingTeam;
            final int bidAmount;
            final int tricksWon;
            final int biddingTeamPoints;
            final int opposingTeamPoints;

            const BidScoreResult({
              required this.success,
              required this.biddingTeam,
              required this.bidAmount,
              required this.tricksWon,
              required this.biddingTeamPoints,
              required this.opposingTeamPoints,
            });
          }

          class BidScoringEngine {
            final List<int> teamScores = [0, 0];

            BidScoreResult calculateAndApply({
              required int biddingTeam,
              required int bidAmount,
              required int tricksWonByBiddingTeam,
            }) {
              if (biddingTeam != 0 && biddingTeam != 1) {
                throw ArgumentError('Team must be 0 or 1.');
              }

              if (bidAmount < 4 || bidAmount > 8) {
                throw ArgumentError('Bid must be between 4 and 8.');
              }

              if (tricksWonByBiddingTeam < 0 ||
                  tricksWonByBiddingTeam > 8) {
                throw ArgumentError('Tricks must be between 0 and 8.');
              }

              final bool success = bidAmount == 8
                  ? tricksWonByBiddingTeam == 8
                  : tricksWonByBiddingTeam >= bidAmount;

              final int opponentTeam = 1 - biddingTeam;
              final int points = success
                  ? (bidAmount == 8 ? 16 : bidAmount)
                  : bidAmount * 2;

              final int biddingPoints = success ? points : -points;
              final int opposingPoints = success ? 0 : points;

              teamScores[biddingTeam] += biddingPoints;
              teamScores[opponentTeam] += opposingPoints;

              return BidScoreResult(
                success: success,
                biddingTeam: biddingTeam,
                bidAmount: bidAmount,
                tricksWon: tricksWonByBiddingTeam,
                biddingTeamPoints: biddingPoints,
                opposingTeamPoints: opposingPoints,
              );
            }

            int get teamAScore => teamScores[0];
            int get teamBScore => teamScores[1];

            void resetScores() {
              teamScores[0] = 0;
              teamScores[1] = 0;
            }
          }
          EOF

      - name: Create Bid Scoring Tests
        run: |
          mkdir -p test/game
          cat > test/game/bid_scoring_engine_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:loris_card_game/game/engine/bid_scoring_engine.dart';

          void main() {
            group('LORIS Bid Scoring Engine', () {
              late BidScoringEngine engine;

              setUp(() {
                engine = BidScoringEngine();
              });

              test('Successful bid 4 awards 4 points', () {
                final result = engine.calculateAndApply(
                  biddingTeam: 0,
                  bidAmount: 4,
                  tricksWonByBiddingTeam: 4,
                );

                expect(result.success, isTrue);
                expect(engine.teamAScore, 4);
                expect(engine.teamBScore, 0);
              });

              test('Successful bid 7 awards 7 points', () {
                final result = engine.calculateAndApply(
                  biddingTeam: 1,
                  bidAmount: 7,
                  tricksWonByBiddingTeam: 8,
                );

                expect(result.success, isTrue);
                expect(engine.teamBScore, 7);
              });

              test('Successful bid 8 with all 8 tricks awards 16', () {
                final result = engine.calculateAndApply(
                  biddingTeam: 0,
                  bidAmount: 8,
                  tricksWonByBiddingTeam: 8,
                );

                expect(result.success, isTrue);
                expect(engine.teamAScore, 16);
              });

              test('Failed bid 5 gives -10 and +10', () {
                final result = engine.calculateAndApply(
                  biddingTeam: 0,
                  bidAmount: 5,
                  tricksWonByBiddingTeam: 4,
                );

                expect(result.success, isFalse);
                expect(engine.teamAScore, -10);
                expect(engine.teamBScore, 10);
              });

              test('Failed bid 8 gives -16 and +16', () {
                final result = engine.calculateAndApply(
                  biddingTeam: 1,
                  bidAmount: 8,
                  tricksWonByBiddingTeam: 7,
                );

                expect(result.success, isFalse);
                expect(engine.teamBScore, -16);
                expect(engine.teamAScore, 16);
              });

              test('Bids 4 to 7 succeed when target is reached', () {
                for (var bid = 4; bid <= 7; bid++) {
                  final freshEngine = BidScoringEngine();
                  final result = freshEngine.calculateAndApply(
                    biddingTeam: 0,
                    bidAmount: bid,
                    tricksWonByBiddingTeam: bid,
                  );

                  expect(result.success, isTrue);
                  expect(freshEngine.teamAScore, bid);
                }
              });

              test('Scores accumulate across rounds', () {
                engine.calculateAndApply(
                  biddingTeam: 0,
                  bidAmount: 4,
                  tricksWonByBiddingTeam: 4,
                );
                engine.calculateAndApply(
                  biddingTeam: 1,
                  bidAmount: 5,
                  tricksWonByBiddingTeam: 4,
                );

                expect(engine.teamAScore, 14);
                expect(engine.teamBScore, -5);
              });

              test('Rejects invalid bid amount', () {
                expect(
                  () => engine.calculateAndApply(
                    biddingTeam: 0,
                    bidAmount: 3,
                    tricksWonByBiddingTeam: 4,
                  ),
                  throwsArgumentError,
                );
              });

              test('Rejects invalid trick count', () {
                expect(
                  () => engine.calculateAndApply(
                    biddingTeam: 0,
                    bidAmount: 4,
                    tricksWonByBiddingTeam: 9,
                  ),
                  throwsArgumentError,
                );
              });

              test('Rejects invalid team', () {
                expect(
                  () => engine.calculateAndApply(
                    biddingTeam: 2,
                    bidAmount: 4,
                    tricksWonByBiddingTeam: 4,
                  ),
                  throwsArgumentError,
                );
              });

              test('Can reset match scores', () {
                engine.calculateAndApply(
                  biddingTeam: 0,
                  bidAmount: 8,
                  tricksWonByBiddingTeam: 8,
                );

                engine.resetScores();

                expect(engine.teamAScore, 0);
                expect(engine.teamBScore, 0);
              });
            });
          }
          EOF

      - name: Run Flutter Tests
        run: flutter test

      - name: Commit Bid Scoring System
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/game/engine/bid_scoring_engine.dart test/game/bid_scoring_engine_test.dart
          git diff --cached --quiet || git commit -m "Add LORIS bid scoring system"
          git push
