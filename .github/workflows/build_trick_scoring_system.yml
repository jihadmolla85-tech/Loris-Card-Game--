
name: Build LORIS Trick Scoring System

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Trick Scoring Engine
        run: |
          cat > lib/game/engine/trick_scoring_engine.dart <<'EOF'
          class TrickScoringEngine {
            final int playerCount;

            final List<int> playerTricks;
            final List<int> teamScores = [0, 0];

            TrickScoringEngine({
              required this.playerCount,
            }) : playerTricks = List.filled(playerCount, 0) {
              if (playerCount != 4 && playerCount != 6) {
                throw ArgumentError(
                  'Player count must be 4 or 6.',
                );
              }
            }

            int get totalTricks =>
                playerTricks.fold(0, (sum, value) => sum + value);

            int get teamATricks =>
                playerTricks
                    .asMap()
                    .entries
                    .where((entry) => entry.key.isEven)
                    .fold(0, (sum, entry) => sum + entry.value);

            int get teamBTricks =>
                playerTricks
                    .asMap()
                    .entries
                    .where((entry) => entry.key.isOdd)
                    .fold(0, (sum, entry) => sum + entry.value);

            bool get isRoundComplete => totalTricks == 8;

            void recordTrickWinner(int winnerIndex) {
              if (isRoundComplete) {
                throw StateError(
                  'All 8 tricks have already been recorded.',
                );
              }

              if (winnerIndex < 0 || winnerIndex >= playerCount) {
                throw ArgumentError('Invalid winner index.');
              }

              playerTricks[winnerIndex]++;

              final teamIndex = winnerIndex.isEven ? 0 : 1;
              teamScores[teamIndex]++;
            }

            int get teamAScore => teamScores[0];

            int get teamBScore => teamScores[1];

            void resetRound() {
              for (var i = 0; i < playerCount; i++) {
                playerTricks[i] = 0;
              }

              teamScores[0] = 0;
              teamScores[1] = 0;
            }
          }
          EOF

      - name: Create Trick Scoring Tests
        run: |
          cat > test/game/trick_scoring_engine_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:loris_card_game/game/engine/trick_scoring_engine.dart';

          void main() {
            group('LORIS Trick Scoring - 4 Players', () {
              late TrickScoringEngine scoring;

              setUp(() {
                scoring = TrickScoringEngine(playerCount: 4);
              });

              test('one trick gives one point to winner team', () {
                scoring.recordTrickWinner(0);

                expect(scoring.teamAScore, 1);
                expect(scoring.teamBScore, 0);
              });

              test('team members share their trick points', () {
                scoring.recordTrickWinner(0);
                scoring.recordTrickWinner(2);
                scoring.recordTrickWinner(1);

                expect(scoring.teamATricks, 2);
                expect(scoring.teamBTricks, 1);
              });

              test('individual player tricks are counted', () {
                scoring.recordTrickWinner(2);
                scoring.recordTrickWinner(2);
                scoring.recordTrickWinner(0);

                expect(scoring.playerTricks[2], 2);
                expect(scoring.playerTricks[0], 1);
              });

              test('round completes after eight tricks', () {
                for (var i = 0; i < 8; i++) {
                  scoring.recordTrickWinner(i % 4);
                }

                expect(scoring.totalTricks, 8);
                expect(scoring.isRoundComplete, true);
              });

              test('cannot record more than eight tricks', () {
                for (var i = 0; i < 8; i++) {
                  scoring.recordTrickWinner(i % 4);
                }

                expect(
                  () => scoring.recordTrickWinner(0),
                  throwsStateError,
                );
              });

              test('invalid player index is rejected', () {
                expect(
                  () => scoring.recordTrickWinner(4),
                  throwsArgumentError,
                );
              });

              test('round scores can be reset', () {
                scoring.recordTrickWinner(0);
                scoring.recordTrickWinner(1);

                scoring.resetRound();

                expect(scoring.totalTricks, 0);
                expect(scoring.teamAScore, 0);
                expect(scoring.teamBScore, 0);
              });
            });

            group('LORIS Trick Scoring - 6 Players', () {
              late TrickScoringEngine scoring;

              setUp(() {
                scoring = TrickScoringEngine(playerCount: 6);
              });

              test('three players belong to each team', () {
                scoring.recordTrickWinner(0);
                scoring.recordTrickWinner(2);
                scoring.recordTrickWinner(4);

                scoring.recordTrickWinner(1);
                scoring.recordTrickWinner(3);
                scoring.recordTrickWinner(5);

                expect(scoring.teamATricks, 3);
                expect(scoring.teamBTricks, 3);
              });

              test('eight tricks are distributed correctly', () {
                final winners = [0, 2, 4, 1, 3, 5, 0, 2];

                for (final winner in winners) {
                  scoring.recordTrickWinner(winner);
                }

                expect(scoring.totalTricks, 8);
                expect(scoring.teamATricks, 5);
                expect(scoring.teamBTricks, 3);
                expect(scoring.isRoundComplete, true);
              });

              test('invalid player count is rejected', () {
                expect(
                  () => TrickScoringEngine(playerCount: 5),
                  throwsArgumentError,
                );
              });
            });
          }
          EOF

      - name: Run Flutter Tests
        run: |
          flutter pub get
          flutter test --reporter expanded

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Add LORIS trick scoring system" || exit 0
          git push
