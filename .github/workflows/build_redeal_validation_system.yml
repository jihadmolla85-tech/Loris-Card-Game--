
name: Build LORIS Redeal Validation System

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Redeal Files
        run: |
          dart analyze \
            lib/game/engine/redeal_validation_engine.dart \
            lib/game/engine/redeal_controller.dart \
            lib/game/engine/deck_shuffle_engine.dart \
            lib/game/engine/deal_controller.dart \
            test/game/redeal_validation_engine_test.dart \
            test/game/redeal_controller_test.dart \
            test/game/deck_shuffle_engine_test.dart \
            test/game/deal_controller_test.dart

      - name: Run Redeal Validation Tests
        run: flutter test test/game/redeal_validation_engine_test.dart

      - name: Run Redeal Controller Tests
        run: flutter test test/game/redeal_controller_test.dart

      - name: Run Deck Shuffle Tests
        run: flutter test test/game/deck_shuffle_engine_test.dart

      - name: Run Deal Controller Tests
        run: flutter test test/game/deal_controller_test.dart
