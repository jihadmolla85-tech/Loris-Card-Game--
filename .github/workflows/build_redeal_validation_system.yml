
name: Build LORIS Redeal Validation System

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Redeal Validation Engine
        run: |
          mkdir -p lib/game/engine
          cat > lib/game/engine/redeal_validation_engine.dart <<'EOF'
          import '../models/loris_card.dart';

          enum RedealReason {
            everyonePassed,
            allCardsBelowTen,
            bidderHasNoTrump,
          }

          class RedealResult {
            final bool shouldRedeal;
            final List<RedealReason> reasons;
            final int sameDealerIndex;

            const RedealResult({
              required this.shouldRedeal,
              required this.reasons,
              required this.sameDealerIndex,
            });
          }

          class RedealValidationEngine {
            RedealResult evaluate({
              required List<List<Card>> hands,
              required int dealerIndex,
              required bool everyonePassed,
              required bool bidderHasTrumpSuit,
            }) {
              if (hands.length != 4 && hands.length != 6) {
                throw ArgumentError(
                  'Player count must be 4 or 6.',
                );
              }

              if (dealerIndex < 0 || dealerIndex >= hands.length) {
                throw ArgumentError('Invalid dealer index.');
              }

              if (hands.any((hand) => hand.length != 8)) {
                throw ArgumentError(
                  'Each player must have exactly 8 cards.',
                );
              }

              final reasons = <RedealReason>[];

              if (everyonePassed) {
                reasons.add(RedealReason.everyonePassed);
              }

              final hasAllLowHand = hands.any((hand) {
                return hand.every((card) {
                  return !card.isLoris &&
                      card.rank != null &&
                      card.rank! < 10;
                });
              });

              if (hasAllLowHand) {
                reasons.add(RedealReason.allCardsBelowTen);
              }

              if (!everyonePassed && !bidderHasTrumpSuit) {
                reasons.add(RedealReason.bidderHasNoTrump);
              }

              return RedealResult(
                shouldRedeal: reasons.isNotEmpty,
                reasons: List.unmodifiable(reasons),
                sameDealerIndex: dealerIndex,
              );
            }
          }
          EOF

      - name: Create Redeal Validation Tests
        run: |
          mkdir -p test/game
          cat > test/game/redeal_validation_engine_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:loris_card_game/game/models/loris_card.dart';
          import 'package:loris_card_game/game/engine/redeal_validation_engine.dart';

          void main() {
            group('LORIS Redeal Validation Engine', () {
              late RedealValidationEngine engine;

              setUp(() {
                engine = RedealValidationEngine();
              });

              List<Card> lowHand() {
                return List.generate(
                  8,
                  (i) => Card.normal(Suit.clubs, 7 + (i % 3)),
                );
              }

              List<Card> normalHand() {
                return List.generate(
                  8,
                  (i) => Card.normal(Suit.hearts, 10 + (i % 5)),
                );
              }

              List<List<Card>> normalHands(int count) {
                return List.generate(count, (_) => normalHand());
              }

              test('Redeal when everyone passes', () {
                final result = engine.evaluate(
                  hands: normalHands(4),
                  dealerIndex: 2,
                  everyonePassed: true,
                  bidderHasTrumpSuit: true,
                );

                expect(result.shouldRedeal, isTrue);
                expect(
                  result.reasons,
                  contains(RedealReason.everyonePassed),
                );
              });

              test('Redeal when a player has eight cards below ten', () {
                final hands = normalHands(4);
                hands[1] = lowHand();

                final result = engine.evaluate(
                  hands: hands,
                  dealerIndex: 0,
                  everyonePassed: false,
                  bidderHasTrumpSuit: true,
                );

                expect(result.shouldRedeal, isTrue);
                expect(
                  result.reasons,
                  contains(RedealReason.allCardsBelowTen),
                );
              });

              test('LORIS is not counted as a card below ten', () {
                final hands = normalHands(4);
                hands[0] = lowHand();
                hands[0][7] = Card.loris(7);

                final result = engine.evaluate(
                  hands: hands,
                  dealerIndex: 0,
                  everyonePassed: false,
                  bidderHasTrumpSuit: true,
                );

                expect(
                  result.reasons,
                  isNot(contains(RedealReason.allCardsBelowTen)),
                );
              });

              test('Redeal when bidder has no trump suit', () {
                final result = engine.evaluate(
                  hands: normalHands(4),
                  dealerIndex: 1,
                  everyonePassed: false,
                  bidderHasTrumpSuit: false,
                );

                expect(result.shouldRedeal, isTrue);
                expect(
                  result.reasons,
                  contains(RedealReason.bidderHasNoTrump),
                );
              });

              test('No redeal when all conditions are valid', () {
                final result = engine.evaluate(
                  hands: normalHands(4),
                  dealerIndex: 1,
                  everyonePassed: false,
                  bidderHasTrumpSuit: true,
                );

                expect(result.shouldRedeal, isFalse);
                expect(result.reasons, isEmpty);
              });

              test('Same dealer remains after redeal', () {
                final result = engine.evaluate(
                  hands: normalHands(4),
                  dealerIndex: 3,
                  everyonePassed: true,
                  bidderHasTrumpSuit: true,
                );

                expect(result.shouldRedeal, isTrue);
                expect(result.sameDealerIndex, 3);
              });

              test('Supports six players', () {
                final result = engine.evaluate(
                  hands: normalHands(6),
                  dealerIndex: 4,
                  everyonePassed: false,
                  bidderHasTrumpSuit: true,
                );

                expect(result.shouldRedeal, isFalse);
                expect(result.sameDealerIndex, 4);
              });

              test('Can report multiple redeal reasons', () {
                final hands = normalHands(4);
                hands[2] = lowHand();

                final result = engine.evaluate(
                  hands: hands,
                  dealerIndex: 1,
                  everyonePassed: false,
                  bidderHasTrumpSuit: false,
                );

                expect(result.shouldRedeal, isTrue);
                expect(result.reasons.length, 2);
              });

              test('Rejects invalid player count', () {
                expect(
                  () => engine.evaluate(
                    hands: normalHands(5),
                    dealerIndex: 0,
                    everyonePassed: false,
                    bidderHasTrumpSuit: true,
                  ),
                  throwsArgumentError,
                );
              });

              test('Rejects invalid dealer index', () {
                expect(
                  () => engine.evaluate(
                    hands: normalHands(4),
                    dealerIndex: 4,
                    everyonePassed: false,
                    bidderHasTrumpSuit: true,
                  ),
                  throwsArgumentError,
                );
              });

              test('Rejects hands that do not contain eight cards', () {
                final hands = normalHands(4);
                hands[0].removeLast();

                expect(
                  () => engine.evaluate(
                    hands: hands,
                    dealerIndex: 0,
                    everyonePassed: false,
                    bidderHasTrumpSuit: true,
                  ),
                  throwsArgumentError,
                );
              });
            });
          }
          EOF

      - name: Run Flutter Tests
        run: flutter test

      - name: Commit Redeal Validation System
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/game/engine/redeal_validation_engine.dart test/game/redeal_validation_engine_test.dart
          git diff --cached --quiet || git commit -m "Add LORIS redeal validation system"
          git push
