
name: Build LORIS Redeal Validation System

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Redeal Files
        run: |
          dart analyze \
            lib/game/engine/redeal_validation_engine.dart \
            test/game/redeal_validation_engine_test.dart

      - name: Run Redeal Tests
        run: flutter test test/game/redeal_validation_engine_test.dart
